version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: job_scheduler_postgres
    environment:
      POSTGRES_DB: job_scheduler_db
      POSTGRES_USER: job_scheduler_user
      POSTGRES_PASSWORD: secure_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_scheduler_user -d job_scheduler_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-scheduler-network

  job-scheduler-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_scheduler_backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: job_scheduler_db
      DB_USER: job_scheduler_user
      DB_PASSWORD: secure_password_change_me
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - job-scheduler-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  job-scheduler-network:
    driver: bridge
