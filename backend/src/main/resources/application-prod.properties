# Production Profile Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/job_scheduler_db}
spring.datasource.username=${DB_USER:job_scheduler_user}
spring.datasource.password=${DB_PASSWORD:secure_password_change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration for Production
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# Logging Configuration for Production
logging.level.root=WARN
logging.level.com.scheduler=INFO
logging.file.name=/var/log/job-scheduler/application.log
logging.file.max-size=50MB
logging.file.max-history=90

# Connection Pool for Production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
