server:
  port: 8080

spring:
  application:
    name: distributed-job-scheduler
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/job_scheduler_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:job_scheduler_user}
    password: ${DB_PASSWORD:secure_password_change_me}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

scheduler:
  heartbeat-interval-ms: 3000
  heartbeat-timeout-ms: 10000
  poll-interval-ms: 1000
  failover-check-ms: 5000
